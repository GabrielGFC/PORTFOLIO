<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <script>
    // Links antigos com hash levam à rota correspondente na base atual do site.
    (function () {
      var base = '%BASE_URL%'.replace(/\/$/, '');
      var h = location.hash;
      if (h.indexOf('#/') !== 0 || location.pathname.replace(/\/$/, '') !== base) return;
      var parts = h.slice(2).split('?');
      var route = parts[0].replace(/^\/+|\/+$/g, '');
      location.replace(base + '/' + (route ? route + '/' : '') + (parts[1] ? '?' + parts[1] : location.search));
    })();
  </script>
